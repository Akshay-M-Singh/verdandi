# Benchmark sources — datasets, licenses, access, target counts.
# License facts verified 2026-09-30; each entry carries its citation for the
# report. Raw downloads live under benchmark/data/raw/ (gitignored).
version: 1

target_total_docs: 30
target_public_docs: 21
target_synthetic_docs: 9

sources:
- id: fatura2
  kind: public
  target_docs: 12
  content: 10,000 generated invoice images across 50 layouts, annotated fields + line items
  license: CC BY 4.0
  citation: Limam, Dhiaf, Kessentini — "FATURA: A Multi-Layout Invoice Image Dataset for Document Analysis and Understanding" (arXiv 2311.11856, 2023)
  url: https://huggingface.co/datasets/mathieu1256/FATURA2-invoices
  fetch: hf_rows
  hf_dataset: mathieu1256/FATURA2-invoices
  hf_config: default
  hf_splits: [train, test]
  notes: generator-produced (multi-layout synthetic) — treated as PUBLIC data; images only; no line-item annotations (document-level truth only)
- id: cord
  kind: public
  target_docs: 5
  content: 1,000 real Indonesian receipt photos, word boxes + semantic labels incl. line items
  license: CC BY 4.0
  citation: Park et al. — "CORD: A Consolidated Receipt Dataset for Post-OCR Parsing" (NeurIPS Document Intelligence Workshop, 2019)
  url: https://huggingface.co/datasets/naver-clova-ix/cord-v2
  fetch: hf_rows
  hf_dataset: naver-clova-ix/cord-v2
  hf_config: default
  hf_splits: [test]
  notes: real photos; IDR amounts; messy/OCR stratum; line items from the menu grouping
- id: kaggle_docai
  kind: public
  target_docs: 4
  content: 520 scanned (TIFF) invoices with Google Document AI parse JSON
  license: CC BY 4.0
  citation: Kaggle "Invoices for Document AI" (holtskinner), source TIFFs from Kaggle "Text Extraction for OCR" (manishthem)
  url: https://www.kaggle.com/datasets/holtskinner/invoices-document-ai
  fetch: kaggle
  kaggle_dataset: holtskinner/invoices-document-ai
  access: KAGGLE_API_TOKEN (new-format token) in .env, or ~/.kaggle/kaggle.json
  notes: >-
    labels are MACHINE-generated (Document AI parse, not human) — every mapped
    truth field requires the owner/AI verification pass before freezing
- id: docile
  kind: public
  target_docs: 0  # DEFERRED 2026-09-30 (owner: "skip docile for now") — its 4 slots went to FATURA2
  content: 6,680 real annotated business documents (invoices/orders), KILE 55 field classes + LIR line items, multi-page, mixed digital/scan
  license: research-use access (request form); repo code MIT
  citation: Šimsa et al. — "DocILE Benchmark for Document Information Localization and Extraction" (ICDAR 2023, arXiv 2302.05658)
  url: https://docile.rossum.ai/
  fetch: docile
  access: requires a dataset token from the access-request form; owner-approved INTERNAL use only (not for redistribution/publication)
  notes: deferred — re-enable by requesting the token and setting target_docs back to 4
- id: synthetic
  kind: generated
  target_docs: 9
  content: deterministic locally generated invoices/receipts covering edge cases (rotation, degradation, handwriting-style, Hindi+English, multi-doc)
  license: ours (this repo)
  citation: benchmark/synthetic/generate.py
  url: benchmark/synthetic/generate.py
  fetch: none
  notes: truth generated by construction; PDFs regenerate deterministically (fixed seeds)
