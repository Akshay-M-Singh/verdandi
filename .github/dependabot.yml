version: 2

# Grouped minor/patch bumps keep the PR list small; majors still arrive as
# individual PRs (and are capped per ecosystem). Security updates are a
# repository setting, not this file, and stay on.
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      python-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: pip
    directory: "/benchmark"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      benchmark-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: "/desktop"
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      npm-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: cargo
    directory: "/desktop/src-tauri"
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      cargo-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      actions-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
