name: Feature request
description: Suggest a capability or an improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the document type, workflow or pain point — not the implementation.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed solution
      description: Optional. If it changes a design decision, link the relevant entry in architecture.md §6.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Capture / OCR
        - Extraction / prompts
        - Verification / flags
        - Review UI
        - Templates / workflows
        - Export
        - Desktop app
        - Benchmark
        - Documentation
    validations:
      required: true
  - type: checkboxes
    id: rules
    attributes:
      label: Project constraints
      options:
        - label: This does not add regex/template field extraction (D5).
          required: true
        - label: This does not require uploading documents to a new service.
          required: true
