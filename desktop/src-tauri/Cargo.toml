[package]
name = "verdandi-desktop"
version = "1.1.0"
description = "Verdandi desktop application"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Akshay-M-Singh/verdandi"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
